<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ant Design Blue -->
  <circle cx="100" cy="100" r="80" fill="#0170FE"/>
  <g transform="translate(100, 100)">
    <!-- Ant icon simplified -->
    <ellipse cx="0" cy="-20" rx="25" ry="30" fill="white"/>
    <ellipse cx="0" cy="20" rx="30" ry="35" fill="white"/>
    <circle cx="-8" cy="-25" r="4" fill="#0170FE"/>
    <circle cx="8" cy="-25" r="4" fill="#0170FE"/>
    <!-- Antennae -->
    <path d="M -10,-45 Q -15,-55 -20,-60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 10,-45 Q 15,-55 20,-60" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M -25,15 L -45,30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,15 L 45,30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M -25,30 L -45,50" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,30 L 45,50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
