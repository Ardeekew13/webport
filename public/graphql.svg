<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- GraphQL Pink/Purple -->
  <g transform="translate(100, 100)">
    <!-- Hexagon outline -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" 
             fill="none" stroke="#E10098" stroke-width="10"/>
    <!-- Dots at vertices -->
    <circle cx="0" cy="-70" r="10" fill="#E10098"/>
    <circle cx="60" cy="-35" r="10" fill="#E10098"/>
    <circle cx="60" cy="35" r="10" fill="#E10098"/>
    <circle cx="0" cy="70" r="10" fill="#E10098"/>
    <circle cx="-60" cy="35" r="10" fill="#E10098"/>
    <circle cx="-60" cy="-35" r="10" fill="#E10098"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="10" fill="#E10098"/>
    <!-- Connecting lines to center -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#E10098" stroke-width="10"/>
    <line x1="0" y1="0" x2="60" y2="-35" stroke="#E10098" stroke-width="10"/>
    <line x1="0" y1="0" x2="60" y2="35" stroke="#E10098" stroke-width="10"/>
  </g>
</svg>
